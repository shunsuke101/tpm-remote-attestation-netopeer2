# sysrepo-plugind.service の drop-in（doc/design/02_netopeer2_systemd.md §3）
# インストール先: /etc/systemd/system/sysrepo-plugind.service.d/10-rats-attester.conf
#
# rats-attester.so は /dev/tpmrm0 を使うので、TPM のデバイス unit と netopeer2-server の後に起動させる。
# dev-tpmrm0.device が無い環境（udev が TAG+="systemd" を付けていない）では、Requires= を外し、
# After=tpm2.target と ConditionPathExists=/dev/tpmrm0 に置き換える。
[Unit]
Requires=dev-tpmrm0.device
After=dev-tpmrm0.device netopeer2-server.service
Wants=netopeer2-server.service
